spring:
  application:
    name: multi-tenant-platform

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
      file-size-threshold: 0
      location: ${java.io.tmpdir}

  # MySQL Connection
  datasource:
    url: jdbc:mysql://localhost:3306/saas_master?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:Ankur265}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # JPA Settings
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: ${SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  # Email Configuration
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:ankurchouhan265@gmail.com}
    password: ${MAIL_PASSWORD:arwx jsfo nvoh jutw}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# Server Config
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

# Logging
logging:
  level:
    root: INFO
    com.saas.platform: ${LOG_LEVEL:DEBUG}
    org.springframework.security: ${SECURITY_LOG_LEVEL:DEBUG}
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/application.log

# Application Configuration (ALL CONFIGURABLE)
app:
  # JWT Configuration
  jwt:
    secret: ${JWT_SECRET:my-super-secret-key-for-jwt-token-generation-must-be-at-least-256-bits-long-for-security}
    expiration: ${JWT_EXPIRATION:86400000}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

  # Email Configuration
  mail:
    from: ${MAIL_FROM:noreply@yourapp.com}
    from-name: ${MAIL_FROM_NAME:Your App Name}

  # Frontend URL
  frontend:
    url: ${FRONTEND_URL:http://localhost:3000}

  # Password Reset Configuration
  password-reset:
    token-expiry: ${PASSWORD_RESET_TOKEN_EXPIRY:30}
  
  # Super Admin Configuration
  superadmin:
    default-password: ${SUPERADMIN_PASSWORD:Admin@1234}
  
  # ✅ NEW: Subscription Configuration (ALL CONFIGURABLE)
  subscription:
    trial-days: ${SUBSCRIPTION_TRIAL_DAYS:14}
    
  # ✅ NEW: Storage Configuration (CONFIGURABLE)
  storage:
    max-file-size-mb: ${STORAGE_MAX_FILE_SIZE_MB:10}
    default-quota-gb: ${STORAGE_DEFAULT_QUOTA_GB:10}
    
  # ✅ NEW: 2FA Configuration (CONFIGURABLE)
  two-factor:
    backup-codes-count: ${TWO_FACTOR_BACKUP_CODES:10}
    code-expiry-minutes: ${TWO_FACTOR_CODE_EXPIRY:5}

# CORS Configuration (CONFIGURABLE)
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:5173}
  allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS,PATCH}
  allowed-headers: ${CORS_ALLOWED_HEADERS:*}
  allow-credentials: ${CORS_ALLOW_CREDENTIALS:true}

# Management Endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# File Upload Configuration (CONFIGURABLE)
file:
  upload:
    dir: ${FILE_UPLOAD_DIR:uploads}
  max:
    size: ${FILE_MAX_SIZE:10485760}